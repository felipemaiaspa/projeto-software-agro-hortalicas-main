<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - AgroHorti</title>
    
    <!-- Fonte Moderna do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Biblioteca Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* Variáveis de Cores e Estilo Global */
        :root {
            --cor-primaria: #2D6A4F; /* Verde escuro agrícola */
            --cor-secundaria: #40916C;
            --cor-fundo: #F4F4F9;
            --cor-texto: #333333;
            --cor-branco: #FFFFFF;
            --sombra-suave: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--cor-fundo); 
            color: var(--cor-texto);
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        /* Menu Lateral (Sidebar) */
        .sidebar {
            width: 250px;
            background-color: var(--cor-primaria);
            color: var(--cor-branco);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        .sidebar h2 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .sidebar a {
            color: var(--cor-branco);
            text-decoration: none;
            padding: 15px 25px;
            font-size: 16px;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar a:hover, .sidebar a.ativo {
            background-color: var(--cor-secundaria);
            border-left: 4px solid #D8F3DC;
        }

        /* Área de Conteúdo Principal */
        .main-content {
            flex: 1;
            padding: 30px 40px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin: 0;
        }

        /* Cartões de Indicadores (KPIs) */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .kpi-card {
            background-color: var(--cor-branco);
            padding: 20px;
            border-radius: 8px;
            box-shadow: var(--sombra-suave);
            border-left: 5px solid var(--cor-primaria);
        }

        .kpi-card h3 {
            font-size: 14px;
            color: #666;
            margin: 0 0 10px 0;
            font-weight: 400;
        }

        .kpi-card p {
            font-size: 24px;
            font-weight: 700;
            margin: 0;
            color: var(--cor-primaria);
        }

        /* Container do Gráfico */
        .grafico-container { 
            background: var(--cor-branco); 
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: var(--sombra-suave); 
            max-width: 100%;
        }

        .grafico-container h3 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: 600;
        }

        /* Responsividade para telas menores */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; flex-direction: row; flex-wrap: wrap; justify-content: center; padding: 10px 0; }
            .sidebar h2 { width: 100%; margin-bottom: 10px; }
            .sidebar a { padding: 10px 15px; }
            .main-content { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Menu Lateral -->
    <nav class="sidebar">
        <h2>AgroHorti 🌾</h2>
        <a href="#" class="ativo">📊 Painel Inicial</a>
        <a href="#">📦 Lotes e Estoque</a>
        <a href="#">🚜 Plantações</a>
        <a href="#">⚙️ Configurações</a>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="main-content">
        <header class="header">
            <h1>Visão Geral da Fazenda</h1>
            <!-- Botão de ação rápida -->
            <button style="background: var(--cor-primaria); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: 600;">+ Novo Registro</button>
        </header>

        <!-- Indicadores (KPIs) -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <h3>Total em Estoque</h3>
                <p>745 Kg</p>
            </div>
            <div class="kpi-card">
                <h3>Variedades Plantadas</h3>
                <p>5 Tipos</p>
            </div>
            <div class="kpi-card" style="border-left-color: #e63946;">
                <h3>Estoque Crítico</h3>
                <p style="color: #e63946;">Alfaces</p>
            </div>
        </div>

        <!-- Área do Gráfico -->
        <div class="grafico-container">
            <h3>Distribuição de Hortaliças (Kg)</h3>
            <canvas id="meuGrafico"></canvas>
        </div>
    </main>

    <script>
        // Dados do Estoque
        const hortalicas = ['Tomates', 'Alfaces', 'Cenouras', 'Batatas', 'Cebolas'];
        const quantidadesKg = [150, 85, 120, 300, 90];

        // Paleta de cores atualizada para combinar com o tema
        const coresGrafico = [
            '#e63946', // Tomates (Vermelho)
            '#2D6A4F', // Alfaces (Verde escuro)
            '#f4a261', // Cenouras (Laranja)
            '#e9c46a', // Batatas (Amarelo/Bege)
            '#9b5de5'  // Cebolas (Roxo)
        ];

        // Renderização Visual do Gráfico
        const ctx = document.getElementById('meuGrafico').getContext('2d');
        
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: hortalicas,
                datasets: [{
                    label: 'Quantidade em Kg',
                    data: quantidadesKg,
                    backgroundColor: coresGrafico,
                    borderRadius: 4 // Arredonda as pontas das barras para um visual mais moderno
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false // Oculta a legenda superior repetitiva
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: '#e0e0e0'
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        }
                    }
                }
            }
        });

        // Ajuste automático da altura do gráfico
        document.getElementById('meuGrafico').parentNode.style.height = '350px';
    </script>
</body>
</html>
